# Regexes run against the issue title and body by .github/workflows/label-issues.yml.
# Form dropdown answers render in the body as "### Area\n\nInstaller or loading", so the
# first pattern in each group matches the form answer exactly and the rest catch free-text
# issues that did not come through a form.

"area:installer":
  - '/### Area\s*\n+\s*Installer/i'
  - '/\b(installer|install\.ps1|setup\.exe|does not load|not loading|ribbon (is )?missing|tab (is )?missing|PackageContents)\b/i'
"area:core":
  - '/### Area\s*\n+\s*pyACAD panel/i'
  - '/\b(settings|shortcuts? editor|console|reload)\b/i'
"area:ai":
  - '/### Area\s*\n+\s*AI \(beta\)/i'
  - '/\b(ask ai|api key|anthropic|claude)\b/i'
"area:commands":
  - '/### Area\s*\n+\s*Commands and command line/i'
  - '/\b(PYACAD(RELOAD|CONSOLE)?|pyacad\.exe|pyacad run|autolisp|\(pyacad |core console|accoreconsole)\b/i'
"area:authoring":
  - '/### Area\s*\n+\s*(Writing my own bundle|Python API)/i'
  - '/(bundle\.yaml|script\.py|\.pushbutton|\.dockpane|pane\.xaml|\bhooks?\b|pyacad\.(script|toast|ui|doc|sel|ents|layers|blocks|xrefs|layouts|plot|audit|lisp|units))/i'
"area:docs":
  - '/### Area\s*\n+\s*Documentation/i'
  - '/\b(docs?\.pyacad|tools\.pyacad|typo|documentation)\b/i'
"tool:new":
  - '/### Area\s*\n+\s*New tool/i'

"acad:2026":
  - '/### AutoCAD version\s*\n+\s*2026/i'
  - '/\bautocad (lt )?2026\b/i'
"acad:2025":
  - '/### AutoCAD version\s*\n+\s*2025/i'
  - '/\bautocad (lt )?2025\b/i'
"acad:2024":
  - '/### AutoCAD version\s*\n+\s*2024/i'
  - '/\bautocad (lt )?2024\b/i'
"acad:2023":
  - '/### AutoCAD version\s*\n+\s*2023/i'
  - '/\bautocad (lt )?2023\b/i'
"acad:2022":
  - '/### AutoCAD version\s*\n+\s*2022/i'
  - '/\bautocad (lt )?2022\b/i'
"acad:2021":
  - '/### AutoCAD version\s*\n+\s*2021/i'
  - '/\bautocad (lt )?2021\b/i'

# Free-text issues that skipped the forms still get a type label.
"bug":
  - '/\b(crash|exception|does not work|doesn.t work|broken|fails?|stack ?trace)\b/i'
"enhancement":
  - '/\b(feature request|would be (nice|great)|could you add|please add|suggestion)\b/i'
"question":
  - '/\b(how do i|how to|is it possible|can i)\b/i'
