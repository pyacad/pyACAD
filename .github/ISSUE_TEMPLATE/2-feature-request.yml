name: Feature request
description: A new tool, or a change to an existing one.
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where would this live?
      options:
        - New tool (a new button or panel)
        - pyACAD panel (Settings, Shortcuts, Console, Reload)
        - AI (beta) panel
        - Commands and command line (PYACAD, pyacad.exe, AutoLISP)
        - Python API or bundle authoring
        - Installer
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do in AutoCAD today that is slow, manual, or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: Describe the button, panel, or behaviour you have in mind. Sketches and screenshots help.
    validations:
      required: true
  - type: dropdown
    id: workaround
    attributes:
      label: Do you have a workaround today?
      options:
        - No, I do it by hand
        - Yes, a script, a LISP routine or another add-in
        - Yes, but it is painful
